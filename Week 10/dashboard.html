<!DOCTYPE html>
<html>
<head>
    <title>IAM Auditor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🔐 IAM Audit Dashboard</h1>

<div class="upload">
    <input type="file" id="usersFile">
    <input type="file" id="rolesFile">
    <button onclick="runAudit()">Run Audit</button>
</div>

<h2>Summary</h2>
<canvas id="severityChart"></canvas>

<h2>Violations</h2>
<input type="text" id="filterInput" placeholder="Filter by username..." onkeyup="filterTable()">

<table id="resultsTable">
    <thead>
        <tr>
            <th>User</th>
            <th>Type</th>
            <th>Severity</th>
            <th>Details</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<button onclick="exportCSV()">Export CSV</button>

<script src="dashboard.js"></script>

</body>
</html>
